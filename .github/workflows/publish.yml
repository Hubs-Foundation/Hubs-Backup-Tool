name: Build

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Configure
        uses: actions/setup-node@v4
        with:
          node-version: 24
          check-latest: true
      - name: Checkout
        uses: actions/checkout@v3
      - name: Get package info
        id: package
        uses: codex-team/action-nodejs-package-info@v1.1
      - name: Build
        run: npm ci
      - name: Make
        run: npm run make -- --platform linux
      - name: Publish
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: "hubs-backup-tool-linux-x64-${{ steps.package.outputs.version }}.zip"
          path: out/make/zip/linux/x64
          if-no-files-found: error

  build-darwin:
    runs-on: macos-15-intel
    timeout-minutes: 20
    steps:
      - name: Configure
        uses: actions/setup-node@v4
        with:
          node-version: 24
          check-latest: true
      - name: Checkout
        uses: actions/checkout@v3
      - name: Get package info
        id: package
        uses: codex-team/action-nodejs-package-info@v1.1
      - name: Build
        run: npm ci
      - name: Make
        run: npm run make -- --platform darwin
      - name: Publish
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: "hubs-backup-tool-darwin-x64-${{ steps.package.outputs.version }}.zip"
          path: out/make/zip/darwin/x64
          if-no-files-found: error

  build-windows:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Configure
        uses: actions/setup-node@v4
        with:
          node-version: 24
          check-latest: true
      - name: Checkout
        uses: actions/checkout@v3
      - name: Get package info
        id: package
        uses: codex-team/action-nodejs-package-info@v1.1
      - name: Build
        run: npm ci
      - name: Make
        run: npm run make -- --platform win32
      - name: Publish
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: "hubs-backup-tool-win32-x64-${{ steps.package.outputs.version }}.zip"
          path: out/make/zip/win32/x64
          if-no-files-found: error
